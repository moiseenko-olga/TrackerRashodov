<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💸 Трекер расходов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0D0F14;
    --surface:  #161920;
    --surface2: #1E2230;
    --border:   #262B3A;
    --text:     #F0F2F8;
    --text2:    #7A8099;
    --accent:   #7C6AF5;
    --green:    #22C88A;
    --yellow:   #F5A623;
    --red:      #E84E4E;
    --sidebar:  240px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Golos Text', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar);
    min-width: var(--sidebar);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .logo {
    padding: 24px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .logo-icon { font-size: 30px; }
  .logo-text { font-family: 'Unbounded', sans-serif; font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }
  .logo-sub  { font-size: 10px; color: var(--text2); font-family: 'Golos Text', sans-serif; font-weight: 400; }

  nav { flex: 1; padding: 4px 8px; }
  .nav-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border-radius: 8px;
    color: var(--text2);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all .15s;
    margin-bottom: 2px;
  }
  .nav-link:hover { background: var(--surface2); color: var(--text); }
  .nav-link.active { background: var(--surface2); color: var(--accent); }
  .nav-icon { font-size: 18px; width: 22px; text-align: center; }

  /* ── PERIOD SELECTOR ── */
  .period-box {
    margin: 8px;
    padding: 12px;
    background: var(--surface2);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .period-label { font-size: 10px; font-weight: 600; color: var(--text2); margin-bottom: 8px; letter-spacing: .06em; }
  .period-selects { display: flex; gap: 6px; }
  .period-selects select {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
  }
  .period-selects select:focus { border-color: var(--accent); }

  /* ── MAIN ── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 40px 48px;
    min-width: 0;
  }
  .content-wrap {
    max-width: 1200px;
    width: 100%;
  }

  /* ── PAGE HEADER ── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .page-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 28px;
    font-weight: 700;
  }
  .page-sub { color: var(--text2); font-size: 15px; margin-bottom: 32px; margin-top: 6px; }

  /* ── STAT CARDS ── */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 28px;
  }
  .stat-label { font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: .07em; margin-bottom: 10px; }
  .stat-value { font-family: 'Unbounded', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1; margin-bottom: 6px; }
  .stat-sub   { font-size: 13px; color: var(--text2); }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .section-label {
    font-size: 10px; font-weight: 700; color: var(--text2);
    letter-spacing: .08em; margin: 20px 0 10px;
  }

  /* ── EXPENSE ROW ── */
  .expense-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  .expense-row:last-child { border-bottom: none; }
  .expense-row:hover { background: var(--surface2); }
  .expense-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .expense-cat { font-size: 14px; font-weight: 600; min-width: 160px; }
  .expense-desc { font-size: 13px; color: var(--text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .expense-date { font-size: 12px; color: var(--text2); min-width: 90px; text-align: right; }
  .expense-amount { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 600; min-width: 110px; text-align: right; }
  .btn-del {
    background: none; border: none; color: var(--text2); cursor: pointer;
    font-size: 16px; padding: 5px 8px; border-radius: 6px; transition: all .15s; flex-shrink: 0;
  }
  .btn-del:hover { color: var(--red); background: rgba(232,78,78,.1); }

  /* ── PROGRESS BAR ── */
  .progress-bar { height: 7px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin: 6px 0; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width .3s; }

  /* ── CAT ROW ── */
  .cat-row {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .cat-row:last-child { border-bottom: none; }
  .cat-name { flex: 1; font-size: 14px; font-weight: 600; }
  .cat-pct  { font-size: 12px; color: var(--text2); min-width: 44px; text-align: right; }
  .cat-amount { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 600; min-width: 110px; text-align: right; }

  /* ── FORM ── */
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; max-width: 540px; }
  .form-group { margin-bottom: 22px; }
  .form-label { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: .08em; display: block; margin-bottom: 9px; }
  .form-input, .form-select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 13px 16px;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s;
  }
  .form-input:focus, .form-select:focus { border-color: var(--accent); }
  .form-select { cursor: pointer; }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 11px 20px; border-radius: 8px; border: none;
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s; text-decoration: none;
  }
  .btn-primary  { background: var(--accent); color: white; }
  .btn-primary:hover  { background: #6a58e0; }
  .btn-danger   { background: var(--red); color: white; }
  .btn-danger:hover   { background: #c73d3d; }
  .btn-ghost    { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
  .btn-ghost:hover    { color: var(--text); border-color: var(--accent); }

  /* ── NOTIF CARD ── */
  .notif-card {
    border-radius: 12px; border-left: 4px solid; padding: 16px 18px; margin-bottom: 10px;
    background: var(--surface);
  }
  .notif-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .notif-icon { font-size: 20px; }
  .notif-title { font-size: 14px; font-weight: 700; }
  .notif-body { font-size: 13px; color: var(--text2); line-height: 1.5; }

  /* ── LIMIT ROW ── */
  .limit-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-bottom: 10px; }
  .limit-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .limit-name { font-size: 14px; font-weight: 600; }
  .limit-info { font-size: 12px; color: var(--text2); }
  .limit-form { display: flex; gap: 8px; margin-top: 12px; }
  .limit-form input { flex: 1; }
  .limit-form .btn { padding: 10px 18px; font-size: 13px; }

  /* ── MSG ── */
  .msg { padding: 14px 18px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; font-weight: 500; }
  .msg-ok  { background: rgba(34,200,138,.12); color: var(--green); border: 1px solid rgba(34,200,138,.25); }
  .msg-err { background: rgba(232,78,78,.12); color: var(--red);   border: 1px solid rgba(232,78,78,.25); }

  /* ── HISTORY ROW ── */
  .hist-row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  .hist-row:last-child { border-bottom: none; }
  .hist-month { flex: 1; font-size: 14px; font-weight: 600; }
  .hist-count { font-size: 12px; color: var(--text2); }
  .hist-amount { font-family: 'Unbounded', sans-serif; font-size: 14px; font-weight: 600; }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .sidebar { width: 64px; min-width: 64px; }
    .logo-text, .logo-sub, .nav-link span, .period-box { display: none; }
    .main { padding: 20px 16px; }
    .stat-grid { grid-template-columns: 1fr; }
    .expense-cat { min-width: 100px; }
  }
  @media (max-width: 900px) {
    .stat-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 1400px) {
    :root { --sidebar: 260px; }
    .main { padding: 48px 60px; }
    body { font-size: 16px; }
  }

  .empty { padding: 48px; text-align: center; color: var(--text2); font-size: 14px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">
    <span class="logo-icon">💸</span>
    <div>
      <div class="logo-text">Трекер<br>расходов</div>
    </div>
  </div>

  <nav>
    <a href="/dashboard{{ '?year='~year~'&month='~month if year is defined else '' }}"
       class="nav-link {% if page == 'dashboard' %}active{% endif %}">
      <span class="nav-icon">📊</span><span>Дашборд</span>
    </a>
    <a href="/add" class="nav-link {% if page == 'add' %}active{% endif %}">
      <span class="nav-icon">➕</span><span>Добавить расход</span>
    </a>
    <a href="/expenses{{ '?year='~year~'&month='~month if year is defined else '' }}"
       class="nav-link {% if page == 'expenses' %}active{% endif %}">
      <span class="nav-icon">📋</span><span>Все расходы</span>
    </a>
    <a href="/report{{ '?year='~year~'&month='~month if year is defined else '' }}"
       class="nav-link {% if page == 'report' %}active{% endif %}">
      <span class="nav-icon">📈</span><span>Отчёт</span>
    </a>
    <a href="/notifications{{ '?year='~year~'&month='~month if year is defined else '' }}"
       class="nav-link {% if page == 'notifications' %}active{% endif %}">
      <span class="nav-icon">🔔</span><span>Уведомления</span>
    </a>
    <a href="/limits{{ '?year='~year~'&month='~month if year is defined else '' }}"
       class="nav-link {% if page == 'limits' %}active{% endif %}">
      <span class="nav-icon">⚙️</span><span>Лимиты</span>
    </a>
  </nav>

  {% if year is defined %}
  <div class="period-box">
    <div class="period-label">ПЕРИОД</div>
    <div class="period-selects">
      <select id="sel-month" onchange="changePeriod()">
        {% for i in range(1,13) %}
        <option value="{{ i }}" {% if i == month %}selected{% endif %}>{{ '%02d'|format(i) }}</option>
        {% endfor %}
      </select>
      <select id="sel-year" onchange="changePeriod()">
        {% for y in range(2022, 2028) %}
        <option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <script>
  function changePeriod() {
    const m = document.getElementById('sel-month').value;
    const y = document.getElementById('sel-year').value;
    const cur = window.location.pathname;
    window.location.href = cur + '?year=' + y + '&month=' + m;
  }
  </script>
  {% endif %}
</aside>

<main class="main">
  <div class="content-wrap">
    {% block content %}{% endblock %}
  </div>
</main>
</body>
</html>
